<!DOCTYPE html>
<html lang="en">

<head>
    <title>NotifySync Configuration</title>
</head>

<body>
    <div data-role="page" class="page type-interior pluginConfigurationPage"
        data-require="emby-button,emby-input,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="notifySyncConfigForm">
                    <div class="verticalSection">
                        <div class="sectionTitleContainer">
                            <h2 class="sectionTitle" id="i18n-title"></h2>
                            <p id="i18n-desc"></p>
                        </div>

                        <div class="inputContainer">
                            <label class="inputLabel" for="maxItems" id="i18n-quotaLabel"></label>
                            <input is="emby-input" type="number" id="maxItems" name="maxItems" min="3" max="20" />
                            <div class="fieldDescription" id="i18n-quotaDesc"></div>
                        </div>

                        <div class="inputContainer">
                            <h3 class="sectionTitle" id="i18n-libTitle"></h3>
                            <div class="fieldDescription" id="i18n-libDesc"></div>
                            <div id="libraryCheckboxes"
                                style="margin-top:10px; padding: 10px; background: rgba(0,0,0,0.2); min-height:50px;">
                            </div>
                        </div>

                        <div class="inputContainer">
                            <h3 class="sectionTitle" id="i18n-mapTitle"></h3>
                            <div class="fieldDescription" id="i18n-mapDesc"></div>
                            <div style="display:flex; gap:10px; margin-bottom:10px; align-items:flex-end;">
                                <div style="flex-grow:1;">
                                    <label class="inputLabel" id="i18n-mapLibLabel"></label>
                                    <select id="mappingLibrarySelect" is="emby-select" style="width:100%;"></select>
                                </div>
                                <div style="flex-grow:1;">
                                    <label class="inputLabel" id="i18n-mapCatLabel"></label>
                                    <input is="emby-input" id="mappingCategoryInput" />
                                </div>
                                <button type="button" is="emby-button" class="raised button-accent"
                                    id="i18n-addBtn" onclick="NotifySyncConf.addMapping()" style="margin-bottom:5px;">
                                </button>
                            </div>
                            <div id="mappingList"
                                style="background: rgba(0,0,0,0.1); border-radius: 4px; overflow:hidden;"></div>
                        </div>

                        <div class="inputContainer">
                            <h3 class="sectionTitle" id="i18n-manualTitle"></h3>
                            <div class="fieldDescription" id="i18n-manualDesc"></div>
                            <textarea is="emby-textarea" id="manualLibraryIds" name="manualLibraryIds"
                                rows="2"></textarea>
                        </div>

                        <div style="margin-top:30px;">
                            <button is="emby-button" type="submit" class="raised button-submit block"
                                id="i18n-saveBtn" style="margin-bottom:20px;">
                            </button>

                            <h3 class="sectionTitle" id="i18n-maintTitle"></h3>
                            <p class="fieldDescription" id="i18n-maintDesc"></p>
                            <button is="emby-button" type="button" class="raised button-cancel block"
                                id="i18n-refreshBtn" onclick="NotifySyncConf.refreshHistory()">
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <script type="text/javascript">
            const cfgStrings = {
                fr: {
                    title: "Configuration NotifySync",
                    desc: "Gérez les notifications et les catégories de la cloche.",
                    quotaLabel: "Quota par Catégorie",
                    quotaDesc: "Définit le nombre d'éléments à garder pour CHAQUE type (ex: 5 Films + 5 Animes + 5 Musiques).",
                    libTitle: "Bibliothèques Surveillées",
                    libDesc: "Cochez les bibliothèques à afficher dans la cloche.",
                    loading: "Chargement...",
                    mapTitle: "Mappage des Catégories",
                    mapDesc: "Créez vos propres catégories (ex: Documentaires, Animes).",
                    mapLibLabel: "Bibliothèque source",
                    mapCatLabel: "Nom de la catégorie cible",
                    mapPlaceholder: "ex: Animes",
                    addBtn: "Ajouter",
                    manualTitle: "Sélection Manuelle (IDs ou Noms)",
                    manualDesc: "Si les cases ci-dessus ne fonctionnent pas, entrez ici l'ID ou le nom exact du dossier.",
                    saveBtn: "Sauvegarder la configuration",
                    maintTitle: "Maintenance",
                    maintDesc: "Cliquez ici après avoir changé les bibliothèques pour forcer le scan.",
                    refreshBtn: "🔄 Régénérer l'historique et appliquer les filtres",
                    successMsg: "Historique régénéré ! Vérifiez la cloche.",
                    successTitle: "Succès",
                    rateLimitMsg: "Veuillez patienter 30 secondes entre chaque rafraîchissement.",
                    rateLimitTitle: "Patience",
                    errorMsg: "Erreur régénération.",
                    errorTitle: "Erreur",
                    fetching: "Récupération...",
                    selectLib: "-- Choisir une bibliothèque --",
                    noLibs: "Aucune bibliothèque trouvée via API.",
                    noMappings: "Aucune catégorie personnalisée définie.",
                    libPrefix: "Bibliothèque ",
                    deleteBtn: "Supprimer"
                },
                en: {
                    title: "NotifySync Configuration",
                    desc: "Manage notifications and bell categories.",
                    quotaLabel: "Quota per Category",
                    quotaDesc: "Number of items to keep for EACH type (e.g., 5 Movies + 5 Anime + 5 Music).",
                    libTitle: "Monitored Libraries",
                    libDesc: "Check the libraries to display in the bell.",
                    loading: "Loading...",
                    mapTitle: "Category Mapping",
                    mapDesc: "Create your own categories (e.g., Documentaries, Anime).",
                    mapLibLabel: "Source library",
                    mapCatLabel: "Target category name",
                    mapPlaceholder: "e.g., Anime",
                    addBtn: "Add",
                    manualTitle: "Manual Selection (IDs or Names)",
                    manualDesc: "If the checkboxes above don't work, enter the exact ID or folder name here.",
                    saveBtn: "Save configuration",
                    maintTitle: "Maintenance",
                    maintDesc: "Click here after changing libraries to force a scan.",
                    refreshBtn: "🔄 Regenerate history and apply filters",
                    successMsg: "History regenerated! Check the bell.",
                    successTitle: "Success",
                    rateLimitMsg: "Please wait 30 seconds between refreshes.",
                    rateLimitTitle: "Please wait",
                    errorMsg: "Regeneration error.",
                    errorTitle: "Error",
                    fetching: "Fetching...",
                    selectLib: "-- Choose a library --",
                    noLibs: "No libraries found via API.",
                    noMappings: "No custom categories defined.",
                    libPrefix: "Library ",
                    deleteBtn: "Delete"
                }
            };

            let CT = cfgStrings[(navigator.language || 'en').startsWith('fr') ? 'fr' : 'en'];

            function applyTranslations(page) {
                const ids = ['title', 'desc', 'quotaLabel', 'quotaDesc', 'libTitle', 'libDesc',
                    'mapTitle', 'mapDesc', 'mapLibLabel', 'mapCatLabel', 'addBtn',
                    'manualTitle', 'manualDesc', 'saveBtn', 'maintTitle', 'maintDesc', 'refreshBtn'];
                ids.forEach(id => {
                    const el = page.querySelector('#i18n-' + id);
                    if (el) el.textContent = CT[id];
                });
                const catInput = page.querySelector('#mappingCategoryInput');
                if (catInput) catInput.placeholder = CT.mapPlaceholder;
            }

            const NotifySyncConf = {
                pluginId: "95655672-2342-4321-8291-321312312312",
                config: {},

                load: async function (page) {
                    // Apply browser-based translations immediately (no flash of empty labels)
                    applyTranslations(page);
                    Dashboard.showLoadingMsg();
                    try {
                        // Override with Jellyfin user language if different
                        try {
                            const userInfo = await ApiClient.getCurrentUser();
                            const jfLang = userInfo?.Configuration?.UICulture || navigator.language || 'en';
                            const newCT = cfgStrings[jfLang.startsWith('fr') ? 'fr' : 'en'];
                            if (newCT !== CT) {
                                CT = newCT;
                                applyTranslations(page);
                            }
                        } catch (e) { /* keep browser lang */ }

                        const cfg = await ApiClient.getPluginConfiguration(this.pluginId);
                        this.config = cfg || {};
                        this.config.EnabledLibraries = this.config.EnabledLibraries || [];
                        this.config.CategoryMappings = this.config.CategoryMappings || [];
                        this.config.ManualLibraryIds = this.config.ManualLibraryIds || [];

                        page.querySelector('#maxItems').value = this.config.MaxItems || 5;
                        page.querySelector('#manualLibraryIds').value = this.config.ManualLibraryIds.join(', ');

                        await this.renderLibs(page);
                        this.renderMap(page);
                    } catch (err) {
                        console.error('NotifySync config load error', err);
                    } finally {
                        Dashboard.hideLoadingMsg();
                    }
                },

                refreshHistory: async function () {
                    Dashboard.showLoadingMsg();
                    try {
                        await ApiClient.ajax({ type: "POST", url: "/NotifySync/Refresh" });
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert({ message: CT.successMsg, title: CT.successTitle });
                    } catch (err) {
                        Dashboard.hideLoadingMsg();
                        if (err && err.status === 429) {
                            Dashboard.alert({ message: CT.rateLimitMsg, title: CT.rateLimitTitle });
                        } else {
                            Dashboard.alert({ message: CT.errorMsg, title: CT.errorTitle });
                        }
                    }
                },

                renderLibs: async function (page) {
                    const container = page.querySelector('#libraryCheckboxes');
                    const select = page.querySelector('#mappingLibrarySelect');
                    container.innerHTML = CT.fetching;

                    try {
                        const result = await ApiClient.getUserViews({}, ApiClient.getCurrentUserId());
                        const items = result.Items || [];
                        container.innerHTML = '';
                        select.innerHTML = '<option value="">' + CT.selectLib + '</option>';

                        if (items.length === 0) {
                            container.innerHTML = CT.noLibs;
                            return;
                        }

                        items.sort((a, b) => a.Name.localeCompare(b.Name));

                        for (const item of items) {
                            if (item.CollectionType === 'boxsets' || item.CollectionType === 'playlists') continue;

                            const isChecked = this.config.EnabledLibraries.includes(item.Id);

                            const div = document.createElement('div');
                            div.style.marginBottom = "5px";

                            const label = document.createElement('label');
                            label.style.display = "flex";
                            label.style.alignItems = "center";

                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            checkbox.setAttribute('is', 'emby-checkbox');
                            checkbox.name = 'enabledLibs';
                            checkbox.value = item.Id;
                            if (isChecked) checkbox.checked = true;

                            const span = document.createElement('span');
                            span.style.marginLeft = "8px";
                            span.innerText = item.Name;

                            label.appendChild(checkbox);
                            label.appendChild(span);
                            div.appendChild(label);
                            container.appendChild(div);

                            const option = document.createElement('option');
                            option.value = item.Id;
                            option.innerText = item.Name;
                            select.appendChild(option);
                        }
                    } catch (err) {
                        console.error('getUserViews API error', err);
                    }
                },

                renderMap: function (page) {
                    const list = page.querySelector('#mappingList');
                    list.innerHTML = '';

                    if (this.config.CategoryMappings.length === 0) {
                        list.innerHTML = '<div style="padding:10px; color:#888; font-style:italic;">' + CT.noMappings + '</div>';
                        return;
                    }

                    const select = page.querySelector('#mappingLibrarySelect');

                    this.config.CategoryMappings.forEach((mapping, index) => {
                        let libName = mapping.LibraryId;
                        if (select) {
                            const option = Array.from(select.options).find(opt => opt.value === mapping.LibraryId);
                            if (option) libName = option.textContent || option.innerText || mapping.LibraryId;
                        }

                        const div = document.createElement('div');
                        div.style.padding = "10px";
                        div.style.borderBottom = "1px solid #333";
                        div.style.display = "flex";
                        div.style.justifyContent = "space-between";
                        div.style.alignItems = "center";

                        const span = document.createElement('span');
                        const libBold = document.createElement('b');
                        libBold.textContent = libName;
                        const catBold = document.createElement('b');
                        catBold.style.color = '#00a4dc';
                        catBold.textContent = mapping.CategoryName;
                        span.appendChild(document.createTextNode(CT.libPrefix));
                        span.appendChild(libBold);
                        span.appendChild(document.createTextNode(' \u2192 '));
                        span.appendChild(catBold);
                        div.appendChild(span);

                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.innerText = CT.deleteBtn;
                        btn.style.color = 'red';
                        btn.setAttribute('data-index', index);
                        btn.onclick = (e) => {
                            this.delMap(parseInt(e.target.getAttribute('data-index')));
                        };
                        div.appendChild(btn);
                        list.appendChild(div);
                    });
                },

                addMapping: function () {
                    const page = document.querySelector('.pluginConfigurationPage');
                    const lib = page.querySelector('#mappingLibrarySelect').value;
                    const cat = page.querySelector('#mappingCategoryInput').value;

                    if (lib && cat) {
                        this.config.CategoryMappings.push({ LibraryId: lib, CategoryName: cat });
                        this.renderMap(page);
                        page.querySelector('#mappingCategoryInput').value = '';
                    }
                },

                delMap: function (index) {
                    this.config.CategoryMappings.splice(index, 1);
                    this.renderMap(document.querySelector('.pluginConfigurationPage'));
                },

                save: async function () {
                    Dashboard.showLoadingMsg();
                    try {
                        const page = document.querySelector('.pluginConfigurationPage');
                        this.config.MaxItems = parseInt(page.querySelector('#maxItems').value);

                        const checkboxes = page.querySelectorAll('input[name="enabledLibs"]:checked');
                        this.config.EnabledLibraries = Array.from(checkboxes).map(checkbox => checkbox.value);

                        const manualStr = page.querySelector('#manualLibraryIds').value;
                        this.config.ManualLibraryIds = manualStr
                            ? manualStr.split(',').map(s => s.trim()).filter(s => s)
                            : [];

                        const response = await ApiClient.updatePluginConfiguration(this.pluginId, this.config);
                        Dashboard.processPluginConfigurationUpdateResult(response);
                    } catch (err) {
                        console.error('updatePluginConfiguration error', err);
                    } finally {
                        Dashboard.hideLoadingMsg();
                    }
                }
            };

            document.querySelector('#notifySyncConfigForm').addEventListener('submit', (e) => {
                e.preventDefault();
                NotifySyncConf.save();
            });

            document.addEventListener('pageshow', (e) => {
                if (e.target.classList.contains('pluginConfigurationPage')) {
                    NotifySyncConf.load(e.target);
                }
            });
        </script>
    </div>
</body>

</html>
